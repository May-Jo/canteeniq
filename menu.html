<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CanteenIQ | The Kinetic Menu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ffa84f",
                        secondary: "#fecb00",
                        tertiary: "#81ecff",
                        surface: "#1a1a1a",
                        background: "#000000",
                        "on-surface": "#ffffff",
                        "surface-container-low": "#131313",
                        "surface-container-lowest": "#000000",
                        "surface-container-highest": "#262626"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans"],
                        display: ["Plus Jakarta Sans"],
                        body: ["Manrope"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(38, 38, 38, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .food-card {
            background: #121212;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .food-card:hover {
            border-color: rgba(255, 168, 79, 0.3);
            transform: translateY(-4px);
        }
        .food-card.selected {
            border-color: #81ecff;
            background: rgba(129, 236, 255, 0.05);
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #ffa84f 0%, #fe9400 100%);
        }
        body {
            background-color: #000000;
            font-family: 'Manrope', sans-serif;
            color: #ffffff;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="overflow-hidden">

<!-- TopNavBar (Consistent) -->
<header class="fixed top-0 w-full z-50 bg-neutral-900/60 backdrop-blur-xl border-b border-white/5">
    <div class="flex justify-between items-center px-6 py-4 w-full max-w-screen-2xl mx-auto">
        <div class="flex items-center gap-8">
            <div class="text-xl font-black text-orange-500 tracking-tighter">The Kinetic Hearth</div>
            <nav class="hidden md:flex gap-6 items-center">
                <a class="font-['Plus_Jakarta_Sans'] text-neutral-400 font-medium hover:text-orange-400" href="dashboards/student.html">Dashboard</a>
                <a class="font-['Plus_Jakarta_Sans'] text-orange-500 font-bold underline decoration-orange-500 underline-offset-4" href="#">Menu</a>
            </nav>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative w-80 group hidden xl:block">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600" data-icon="search">search</span>
                <input id="food-search" oninput="handleSearch(this.value)" class="w-full bg-zinc-950/50 border border-white/5 rounded-full py-2.5 pl-12 pr-4 text-sm text-white focus:ring-1 focus:ring-primary/50 placeholder:text-zinc-600 outline-none" placeholder="Search nourishment..." type="text"/>
            </div>
            <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30">
                <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuByVCxraS6-OSxFtB4uKlQgwurmtJMyjpHiXPscrmtPU6M69Wj-UDu3y1Ih6X9FDiXMqToCQ8CwZYeBmDn9SkrwGkWOY5YHPIcBRooASCoTqwqcTEEEAj_W8xzQspwmFwA6R_134SbXEg5isdlI5HITOtD7peIjDbE6iHliF6x1dp2RJ3xXZ3Gk7PaoLVA5iiIqFLcs3iUVlE4Re_VGIphHx0aH0445VbAhGa0hvb0oaqOTue4ojecKw-g7Dh2C10lFdjDvlHgOfw"/>
            </div>
        </div>
    </div>
</header>

<!-- SideNavBar -->
<aside class="h-screen w-64 fixed left-0 top-0 z-40 bg-neutral-950/80 backdrop-blur-2xl border-r border-neutral-800/20 shadow-2xl hidden md:flex flex-col py-8 gap-2">
    <div class="px-6 mb-10 pt-20">
        <h2 class="text-lg font-bold text-neutral-100">The Hearth</h2>
        <p class="font-['Manrope'] text-[10px] uppercase tracking-[0.2em] text-neutral-500">Digital Concierge</p>
    </div>
    <nav class="flex flex-col gap-1">
        <a class="flex items-center gap-3 text-neutral-500 px-4 py-3 hover:bg-neutral-800/40 hover:text-neutral-200 transition-all hover:translate-x-1 duration-200" href="dashboards/student.html">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-['Manrope'] text-sm uppercase tracking-widest">Dashboard</span>
        </a>
        <a class="flex items-center gap-3 bg-gradient-to-r from-orange-500/20 to-transparent text-orange-500 border-l-4 border-orange-500 px-4 py-3 hover:translate-x-1 duration-200" href="#">
            <span class="material-symbols-outlined">restaurant</span>
            <span class="font-['Manrope'] text-sm uppercase tracking-widest">Menu</span>
        </a>
        <a class="flex items-center gap-3 text-neutral-500 px-4 py-3 hover:bg-neutral-800/40 hover:text-neutral-200 transition-all hover:translate-x-1 duration-200" href="orders.html">
            <span class="material-symbols-outlined">receipt_long</span>
            <span class="font-['Manrope'] text-sm uppercase tracking-widest">Orders</span>
        </a>
        <a class="flex items-center gap-3 text-neutral-500 px-4 py-3 hover:bg-neutral-800/40 hover:text-neutral-200 transition-all hover:translate-x-1 duration-200" href="#">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-['Manrope'] text-sm uppercase tracking-widest">Settings</span>
        </a>
    </nav>
</aside>

<main class="md:ml-64 pt-24 pb-20 px-6 md:px-12 h-screen overflow-hidden flex gap-0">
    <!-- Menu Grid Area -->
    <section class="flex-grow p-4 md:p-8 overflow-y-auto no-scrollbar">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-4xl font-extrabold font-headline tracking-tighter text-white mb-8">Special Menu</h2>
            
            <!-- Category Filters Box -->
            <div class="glass-panel p-6 mb-10 border border-white/5 rounded-3xl">
                <p class="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-6 px-2">Categories</p>
                <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="filterCategory('all')" class="cat-btn active px-8 py-2.5 kinetic-gradient text-black font-black rounded-full text-xs uppercase tracking-widest shadow-lg min-w-fit">All</button>
                    <button onclick="filterCategory('Breakfast')" class="cat-btn px-8 py-2.5 bg-zinc-900 text-zinc-500 font-black rounded-full text-xs uppercase tracking-widest hover:text-white transition-all min-w-fit">Breakfast</button>
                    <button onclick="filterCategory('Lunch')" class="cat-btn px-8 py-2.5 bg-zinc-900 text-zinc-500 font-black rounded-full text-xs uppercase tracking-widest hover:text-white transition-all min-w-fit">Lunch</button>
                    <button onclick="filterCategory('Snacks')" class="cat-btn px-8 py-2.5 bg-zinc-900 text-zinc-500 font-black rounded-full text-xs uppercase tracking-widest hover:text-white transition-all min-w-fit">Snacks</button>
                    <button onclick="filterCategory('Dinner')" class="cat-btn px-8 py-2.5 bg-zinc-900 text-zinc-500 font-black rounded-full text-xs uppercase tracking-widest hover:text-white transition-all min-w-fit">Dinner</button>
                    <button onclick="filterCategory('Drinks')" class="cat-btn px-8 py-2.5 bg-zinc-900 text-zinc-500 font-black rounded-full text-xs uppercase tracking-widest hover:text-white transition-all min-w-fit">Drinks</button>
                </div>
            </div>

            <!-- Food Grid -->
            <div id="food-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">
                <!-- JS Items -->
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <aside class="w-96 bg-zinc-950 border-l border-white/5 hidden xl:flex flex-col p-8 h-full">
        <h3 class="text-xl font-bold font-headline mb-8">Current Tray</h3>
        <div class="flex-grow overflow-y-auto no-scrollbar space-y-6 mb-8" id="cart-items">
            <div class="flex items-center justify-center h-full text-zinc-600 italic text-sm">Tray is empty...</div>
        </div>

        <div class="border-t border-white/5 pt-8 space-y-4">
            <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-zinc-500">
                <span>Subtotal</span>
                <span id="subtotal">Rs. 0.00</span>
            </div>
            <div class="flex justify-between text-lg font-black text-white">
                <span>Total</span>
                <span id="total">Rs. 0.00</span>
            </div>
            <button onclick="placeOrder()" class="w-full py-4 kinetic-gradient text-black font-black rounded-2xl text-xs uppercase tracking-widest shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all mt-4">Place Order</button>
        </div>
    </aside>
</main>

<script>
    const menuData = [
        { id: 1, name: "Sausage and Bacon", price: 350, cat: "Breakfast", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/sausage-bacon.jpg" },
        { id: 2, name: "Kinetic Noodles", price: 120, cat: "Lunch", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/noodles.jpg" },
        { id: 3, name: "Alu Paratha", price: 180, cat: "Breakfast", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/paratha.jpg" },
        { id: 4, name: "Chicken Roll", price: 120, cat: "Snacks", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/chicken-roll.jpg" },
        { id: 5, name: "Boil Egg", price: 25, cat: "Breakfast", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/egg.jpg" },
        { id: 6, name: "Veg Momos", price: 120, cat: "Snacks", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/momos.jpg" },
        { id: 7, name: "Mutton Biryani", price: 450, cat: "Lunch", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/biryani.jpg" },
        { id: 8, name: "Burger and Fries", price: 150, cat: "Lunch", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/burger.jpg" },
        { id: 9, name: "Classic Coke", price: 60, cat: "Drinks", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/coke.jpg" },
        { id: 10, name: "Milk Coffee", price: 80, cat: "Drinks", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuB1_mB-B03-8d2673_095908_02_2024_02_20/coffee.jpg" }
    ];

    let cart = [];
    let currentQuery = '';
    let currentFilter = 'all';

    function renderMenu() {
        const grid = document.getElementById('food-grid');
        grid.innerHTML = '';
        let itemsToRender = currentFilter === 'all' ? menuData : menuData.filter(i => i.cat === currentFilter);
        if (currentQuery) {
            itemsToRender = itemsToRender.filter(i => i.name.toLowerCase().includes(currentQuery.toLowerCase()));
        }
        itemsToRender.forEach(item => {
            const isSelected = cart.find(c => c.id === item.id);
            const card = document.createElement('div');
            card.className = `food-card cursor-pointer group ${isSelected ? 'selected' : ''}`;
            card.onclick = () => addToCart(item.id);
            card.innerHTML = `
                <div class="h-44 bg-zinc-900 relative">
                    <img src="${item.img}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80'">
                    ${isSelected ? '<div class="absolute top-3 right-3 w-6 h-6 bg-tertiary rounded-full flex items-center justify-center shadow-lg"><span class="material-symbols-outlined text-black text-xs font-black">check</span></div>' : ''}
                </div>
                <div class="p-5">
                    <h4 class="text-white font-bold text-sm mb-1">${item.name}</h4>
                    <p class="text-primary font-black text-xs">Rs. ${item.price.toFixed(2)}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function addToCart(id) {
        const item = menuData.find(i => i.id === id);
        const inCart = cart.find(c => c.id === id);
        if (inCart) inCart.qty++;
        else cart.push({ ...item, qty: 1 });
        renderMenu();
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cart-items');
        if (cart.length === 0) {
            container.innerHTML = `<div class="flex items-center justify-center h-full text-zinc-600 italic text-sm">Tray is empty...</div>`;
            document.getElementById('subtotal').innerText = 'Rs. 0.00';
            document.getElementById('total').innerText = 'Rs. 0.00';
            return;
        }
        container.innerHTML = '';
        let total = 0;
        cart.forEach(item => {
            total += item.price * item.qty;
            const el = document.createElement('div');
            el.className = "flex gap-4 bg-zinc-900 p-4 rounded-2xl border border-white/5";
            el.innerHTML = `
                <div class="flex-grow">
                    <h5 class="text-xs font-bold text-white mb-2">${item.name}</h5>
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] text-zinc-500 font-bold uppercase">${item.qty} × Rs. ${item.price}</span>
                        <p class="text-xs font-black text-primary">Rs. ${item.price * item.qty}</p>
                    </div>
                </div>
            `;
            container.appendChild(el);
        });
        document.getElementById('subtotal').innerText = `Rs. ${total.toFixed(2)}`;
        document.getElementById('total').innerText = `Rs. ${total.toFixed(2)}`;
    }

    function filterCategory(cat) {
        currentFilter = cat;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.toggle('kinetic-gradient', btn.innerText.toLowerCase() === cat.toLowerCase());
            btn.classList.toggle('text-black', btn.innerText.toLowerCase() === cat.toLowerCase());
        });
        renderMenu();
    }

    function handleSearch(q) { currentQuery = q; renderMenu(); }
    function placeOrder() { if(cart.length > 0) { alert('Order Sent!'); cart=[]; renderMenu(); renderCart(); } }
    renderMenu();
</script>

</body>
</html>
