<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanteenIQ | The Kinetic Hearth Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#ffa84f",
                        "primary-container": "#fe9400",
                        obsidian: "#0a0800",
                        "card-bg": "rgba(30, 22, 10, 0.82)",
                        "error-red": "#ff7351"
                    },
                    fontFamily: {
                        jakarta: ["Plus Jakarta Sans", "sans-serif"],
                        manrope: ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0800;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        /* Amber Bokeh Background */
        .bokeh-base {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 40% 55%, 
                rgba(180, 90, 0, 0.35) 0%, 
                rgba(80, 35, 0, 0.18) 40%, 
                #000000 75%);
            z-index: 1;
            backdrop-filter: blur(0px);
        }

        .bokeh-base::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 40% 55%, 
                rgba(180, 90, 0, 0.55) 0%, 
                rgba(80, 35, 0, 0.25) 40%, 
                transparent 75%);
            filter: blur(60px);
            z-index: -1;
        }

        /* Glassmorphism Card */
        #login-card {
            position: relative;
            z-index: 10;
            width: 420px;
            background: rgba(30, 22, 10, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 168, 79, 0.10);
            border-radius: 24px;
            padding: 40px 36px 36px;
            box-shadow: 0 8px 80px rgba(0,0,0,0.6), 0 0 120px rgba(180,90,0,0.08);
            transform: scale(0.94);
            opacity: 0;
        }

        /* Entry Animation (Spring Feel) */
        .animate-card-entry {
            animation: springEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes springEntry {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Floating Back Arrow */
        .back-arrow {
            position: absolute;
            top: -48px;
            left: 0;
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
            text-decoration: none;
        }

        .back-arrow:hover {
            color: #ffa84f;
        }

        /* App Icon */
        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffa84f, #fe9400);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(254, 148, 0, 0.35);
        }

        .app-icon .material-symbols-outlined {
            font-size: 28px;
            color: white;
            font-variation-settings: 'FILL' 1;
        }

        /* Wordmark */
        .brand-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.02em;
            text-align: center;
            margin-top: 14px;
        }

        .brand-text span {
            color: #ffa84f;
        }

        .subtitle {
            font-family: 'Manrope', sans-serif;
            font-size: 10px;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            text-align: center;
            margin-top: 2px;
        }

        /* Labels */
        .input-label {
            font-family: 'Manrope', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #ffa84f;
            text-transform: uppercase;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forgot-text {
            font-family: 'Manrope', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .forgot-text:hover {
            color: #ffa84f;
        }

        /* Inputs */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .custom-input, 
        input.custom-input {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.08) !important;
            background-image: none !important; /* Remove Tailwind forms icons */
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 0 16px 0 60px !important;
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            color: #ffffff !important;
            outline: none;
            transition: all 0.2s ease;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .custom-input:focus {
            border: 1px solid rgba(255, 168, 79, 0.45);
            box-shadow: inset 0 0 0 1px rgba(255, 168, 79, 0.2);
        }

        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 20px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .custom-input:focus + .field-icon {
            color: rgba(255, 168, 79, 0.7);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        /* Error Message */
        .error-label {
            color: #ff7351;
            font-size: 11px;
            margin-top: -16px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Shake Effect */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake-input {
            animation: shake 0.4s ease-in-out;
        }

        /* Primary CTA */
        .primary-btn {
            width: 100%;
            height: 52px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #ffa84f 0%, #fe9400 100%);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .primary-btn:hover {
            box-shadow: 0 0 40px rgba(254, 148, 0, 0.4);
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .primary-btn:active {
            scale: 0.98;
        }

        /* Divider */
        .divider-container {
            display: flex;
            align-items: center;
            margin-top: 24px;
            gap: 12px;
        }

        .divider-line {
            flex: 1;
            height: 0px;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider-text {
            font-family: 'Manrope', sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .google-note {
            margin-top: 10px;
            font-size: 11px;
            color: rgba(255, 168, 79, 0.6);
            font-family: 'Manrope', sans-serif;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Footer */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }

        .request-access {
            font-weight: 700;
            color: #ffa84f;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .request-access:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="selection:bg-primary/30">
    <div class="bokeh-base"></div>

    <div id="login-card" class="animate-card-entry">
        <!-- Back Arrow -->
        <a href="../index.html" class="back-arrow">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
            Back to Home
        </a>

        <!-- App Icon -->
        <div class="app-icon">
            <span class="material-symbols-outlined">restaurant</span>
        </div>

        <!-- Wordmark -->
        <div class="brand-text">Canteen<span>IQ</span></div>
        <div class="subtitle">THE KINETIC HEARTH</div>

        <!-- Form -->
        <form class="mt-8" onsubmit="handleLogin(event)">
            <!-- ID Field -->
            <div class="label-row">
                <label class="input-label">VIT EMAIL / ID</label>
            </div>
            <div class="input-group">
                <input type="text" id="login-id" class="custom-input" placeholder="student@vit.edu">
                <span class="material-symbols-outlined field-icon">mail</span>
                <div id="id-error" class="error-label">ID is required</div>
            </div>

            <!-- Password Field -->
            <div class="label-row pt-2">
                <label class="input-label">PASSWORD</label>
                <div class="forgot-text">FORGOT?</div>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" class="custom-input" placeholder="••••••••">
                <span class="material-symbols-outlined field-icon">lock</span>
                <span class="material-symbols-outlined toggle-password" onclick="togglePassword()">visibility</span>
                <div id="password-error" class="error-label">Password is required</div>
            </div>

            <!-- CTA -->
            <button type="submit" class="primary-btn">
                Access Digital Concierge
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider-container">
            <hr class="divider-line">
            <span class="divider-text">OR CONTINUE WITH</span>
            <hr class="divider-line">
        </div>

        <!-- Google Login -->
        <button class="google-btn" onclick="showGoogleNotice()">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"></path>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.938 5.512 18 9 18z" fill="#34A853"></path>
                <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.712s.102-1.173.282-1.712V4.956H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.044l3.007-2.332z" fill="#FBBC05"></path>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.582C13.463.891 11.426 0 9 0 5.512 0 2.438 2.062.957 4.956L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"></path>
            </svg>
            Login with Google
        </button>
        <div id="google-note" class="google-note">Only @vit.edu Google accounts are permitted.</div>

        <!-- Footer -->
        <div class="login-footer">
            New to the Hearth? <span class="request-access">Request Access</span>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('login-password');
            const icon = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function showGoogleNotice() {
            document.getElementById('google-note').style.opacity = '1';
        }

        function handleLogin(e) {
            e.preventDefault();
            const idField = document.getElementById('login-id');
            const passField = document.getElementById('login-password');
            const idError = document.getElementById('id-error');
            const passError = document.getElementById('password-error');
            
            const idVal = idField.value.trim().toLowerCase();
            const passVal = passField.value.trim();
            
            let valid = true;

            // ID Validation
            if (!idVal) {
                triggerError(idField, idError, "ID is required");
                valid = false;
            } else if (!idVal.endsWith('@vit.edu')) {
                triggerError(idField, idError, "Only @vit.edu emails are permitted");
                valid = false;
            } else {
                clearError(idField, idError);
            }

            // Password Validation
            if (!passVal) {
                triggerError(passField, passError, "Password is required");
                valid = false;
            } else {
                clearError(passField, passError);
            }

            if (valid) {
                // Role Detection
                let role = "student";
                if (idVal.startsWith('adm') || idVal.startsWith('admin')) {
                    window.location.href = '../dashboards/admin.html';
                } else if (idVal.startsWith('stf') || idVal.startsWith('staff')) {
                    window.location.href = '../dashboards/staff.html';
                } else {
                    // Success! Redirect to student dashboard
                    window.location.href = '../dashboards/student.html';
                }
            }
        }

        function triggerError(field, label, msg) {
            field.classList.add('shake-input');
            label.textContent = msg;
            label.style.opacity = '1';
            setTimeout(() => field.classList.remove('shake-input'), 400);
        }

        function clearError(field, label) {
            label.style.opacity = '0';
        }

        // Initialize Entry Animation
        window.onload = () => {
             // Card starts scaling from 0.94, so we just let the CSS animation run.
        };
    </script>
</body>
</html>
